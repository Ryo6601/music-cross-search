<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        width: 340px;
        padding: 14px;
        margin: 0;
        background: #fff;
        color: #111;
      }
      .track {
        margin-bottom: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid #eee;
      }
      .title {
        font-weight: 600;
        font-size: 14px;
        line-height: 1.3;
      }
      .artist {
        color: #666;
        font-size: 12px;
        margin-top: 4px;
      }
      .source {
        color: #999;
        font-size: 11px;
        margin-top: 6px;
      }
      .empty {
        color: #888;
        font-size: 13px;
        line-height: 1.5;
      }
      .links {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      a.btn {
        display: block;
        padding: 8px 10px;
        border-radius: 6px;
        background: #f4f4f5;
        color: #111;
        text-decoration: none;
        font-size: 13px;
      }
      a.btn:hover {
        background: #e8e8eb;
      }
      a.btn.toggle {
        background: #eef2ff;
        color: #2b3a8a;
      }
      a.btn.toggle:hover {
        background: #e0e7ff;
      }

      /* ---- アーティスト情報パネル ---- */
      .artist-panel {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid #eee;
        display: none;
      }
      .artist-panel.open {
        display: block;
      }
      .artist-head {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      .artist-image {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        object-fit: cover;
        background: #ddd;
        flex-shrink: 0;
      }
      .artist-meta {
        flex: 1;
        min-width: 0;
      }
      .artist-name {
        font-weight: 700;
        font-size: 14px;
        line-height: 1.2;
      }
      .section-title {
        font-size: 11px;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-top: 14px;
        margin-bottom: 6px;
      }
      .section-sub {
        text-transform: none;
        font-size: 10px;
        color: #aaa;
        letter-spacing: 0;
      }
      .bio-text {
        font-size: 12px;
        line-height: 1.55;
        color: #333;
        max-height: 160px;
        overflow-y: auto;
        padding-right: 4px;
        white-space: pre-wrap;
      }
      .bio-link {
        display: inline-block;
        margin-top: 4px;
        font-size: 11px;
        color: #1a73e8;
        text-decoration: none;
      }
      .bio-link:hover {
        text-decoration: underline;
      }
      .panel-status {
        font-size: 12px;
        color: #666;
        text-align: center;
        padding: 12px 0;
      }
      .panel-status.err {
        color: #b00020;
      }
    </style>
  </head>
  <body>
    <div id="track" class="track">
      <div class="empty">
        対応サイトで音楽を再生してください<br />
        (YouTube / YouTube Music / Spotify Web / Apple Music Web)
      </div>
    </div>
    <div id="links" class="links"></div>
    <div id="artistPanel" class="artist-panel">
      <div id="artistBody"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
